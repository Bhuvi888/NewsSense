name: Build and deploy Newsense

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy-azure.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: newsense-prod-sea
  AZURE_ACR_NAME: newsenseacr260930sea
  AZURE_ACR_LOGIN_SERVER: newsenseacr260930sea.azurecr.io
  AZURE_API_APP: newsense-backend
  AZURE_FRONTEND_APP: newsense-frontend
  AZURE_INGESTION_JOB: newsense-ingestion-job
  AZURE_API_BASE_URL: https://newsense-backend.jollypond-483f70d9.southeastasia.azurecontainerapps.io

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ==========================================
      # BACKEND
      # ==========================================

      - name: Build backend image in ACR
        run: |
          az acr build \
            --registry "$AZURE_ACR_NAME" \
            --image "newsense-backend:${GITHUB_SHA}" \
            --image "newsense-backend:latest" \
            backend

      - name: Update backend API
        run: |
          az containerapp update \
            --name "$AZURE_API_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR_LOGIN_SERVER/newsense-backend:${GITHUB_SHA}"

      - name: Update ingestion job
        run: |
          az containerapp job update \
            --name "$AZURE_INGESTION_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR_LOGIN_SERVER/newsense-backend:${GITHUB_SHA}"

      # ==========================================
      # FRONTEND
      # ==========================================

      - name: Build frontend image in ACR
        run: |
          az acr build \
            --registry "$AZURE_ACR_NAME" \
            --image "newsense-frontend:${GITHUB_SHA}" \
            --image "newsense-frontend:latest" \
            --build-arg "VITE_API_BASE=${AZURE_API_BASE_URL}/api" \
            --build-arg "VITE_API_DOCS_URL=${AZURE_API_BASE_URL}/docs" \
            frontend

      - name: Update frontend web app
        run: |
          az containerapp update \
            --name "$AZURE_FRONTEND_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$AZURE_ACR_LOGIN_SERVER/newsense-frontend:${GITHUB_SHA}"
